<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um convite para ti</title>
<style>
  /* ============================================================
     PARA PERSONALIZARES: muda estes valores antes de publicares.
     ============================================================ */
  :root{
    --cor-fundo-topo:#241335;
    --cor-fundo-fundo:#3a1f4d;
    --cor-cartao:#2f1a42;
    --cor-cartao-borda:rgba(255,214,166,0.18);
    --cor-texto:#f7ecf5;
    --cor-texto-suave:#d9c7de;
    --cor-rosa:#ff8fa3;
    --cor-rosa-forte:#ff6f91;
    --cor-dourado:#ffd166;
    --fonte-titulo:'Fraunces', serif;
    --fonte-corpo:'Quicksand', sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@500;600;700&display=swap');

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    font-family:var(--fonte-corpo);
    color:var(--cor-texto);
    overflow-x:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px 90px;
    background:radial-gradient(ellipse at 50% -10%, var(--cor-fundo-fundo), var(--cor-fundo-topo) 60%);
  }

  /* ---------- céu e estrelas ---------- */
  #ceu{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .estrela{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.6;
    animation:cintilar 3.5s ease-in-out infinite;
  }
  @keyframes cintilar{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.6);}
  }

  #lua{
    position:fixed;
    top:48px;
    right:8%;
    width:64px;
    height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e6, var(--cor-dourado) 70%);
    box-shadow:0 0 40px 6px rgba(255,209,102,0.35);
    z-index:0;
  }

  #skyline{
    position:fixed;
    left:0; right:0; bottom:0;
    height:120px;
    z-index:0;
    opacity:.55;
    pointer-events:none;
  }

  /* ---------- cartão ---------- */
  #cena{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
  }

  .cartao{
    position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), var(--cor-cartao);
    border:1px solid var(--cor-cartao-borda);
    border-radius:22px;
    padding:44px 32px 38px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
    min-height:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .oculto{display:none !important;}

  h1{
    font-family:var(--fonte-titulo);
    font-weight:600;
    font-size:clamp(26px, 5.5vw, 34px);
    line-height:1.25;
    margin:0 0 12px;
  }

  .subtexto{
    font-size:15px;
    color:var(--cor-texto-suave);
    line-height:1.6;
    margin:0 0 34px;
    max-width:34ch;
  }

  .linha-botoes{
    position:relative;
    width:100%;
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }

  button{
    font-family:var(--fonte-corpo);
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius:999px;
  }

  #btn-sim{
    padding:16px 34px;
    font-size:17px;
    background:linear-gradient(135deg, var(--cor-rosa), var(--cor-rosa-forte));
    color:#2a1030;
    box-shadow:0 12px 26px -8px rgba(255,111,145,0.55);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  #btn-sim:hover{transform:translateY(-2px) scale(1.03);}
  #btn-sim:active{transform:scale(.97);}

  #btn-nao{
    position:relative;
    padding:14px 26px;
    font-size:15px;
    background:transparent;
    color:var(--cor-texto-suave);
    border:1.5px solid rgba(255,255,255,0.18);
    transition:left .28s ease, top .28s ease, transform .2s ease;
  }
  #btn-nao.fugir{
    position:absolute;
  }

  #legenda-fuga{
    min-height:18px;
    margin-top:14px;
    font-size:13px;
    color:var(--cor-dourado);
    opacity:.9;
  }

  /* ---------- ecrã de resposta ---------- */
  #ecra-resposta textarea{
    width:100%;
    resize:none;
    min-height:80px;
    margin-top:6px;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.05);
    color:var(--cor-texto);
    font-family:var(--fonte-corpo);
    font-size:14px;
  }
  #ecra-resposta textarea::placeholder{color:rgba(255,255,255,0.4);}
  #ecra-resposta label{
    display:block;
    text-align:left;
    font-size:13px;
    color:var(--cor-texto-suave);
    margin-top:18px;
  }
  #btn-enviar{
    margin-top:22px;
    padding:14px 30px;
    font-size:15px;
    background:linear-gradient(135deg, var(--cor-rosa), var(--cor-rosa-forte));
    color:#2a1030;
    width:100%;
  }
  #estado-envio{
    margin-top:12px;
    font-size:13px;
    color:var(--cor-texto-suave);
    min-height:16px;
  }

  #ecra-obrigado .emoji{font-size:40px; margin-bottom:6px;}

  @media (prefers-reduced-motion: reduce){
    .estrela{animation:none; opacity:.5;}
    #btn-nao{transition:none;}
  }
</style>
</head>
<body>

<div id="ceu"></div>
<div id="lua"></div>
<svg id="skyline" viewBox="0 0 800 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,120 0,70 40,70 40,50 80,50 80,80 130,80 130,40 170,40 170,90 220,90 220,60 260,60 260,100 310,100 310,55 360,55 360,85 410,85 410,45 460,45 460,95 510,95 510,65 560,65 560,100 610,100 610,50 650,50 650,80 700,80 700,60 740,60 740,90 800,90 800,120" fill="#1a0e28"/>
</svg>

<div id="cena">
  <div class="cartao" id="cartao">

    <!-- ECRÃ 1: a pergunta -->
    <div id="ecra-pergunta">
      <h1 id="titulo-pergunta">Aceitas sair comigo?</h1>
      <p class="subtexto">Gostava muito que aceitasses este convite pouco trabalhoso XD. Basta um clique.</p>
      <div class="linha-botoes" id="linha-botoes">
        <button id="btn-sim">Sim, aceito 💫</button>
        <button id="btn-nao">Não</button>
      </div>
      <div id="legenda-fuga"></div>
    </div>

    <!-- ECRÃ 2: mensagem opcional antes de enviar -->
    <div id="ecra-resposta" class="oculto">
      <h1 id="titulo-resposta">Boa escolha 💫</h1>
      <p class="subtexto">Queres dizer-me alguma coisa antes de eu ficar a saltar de alegria?</p>
      <form id="formulario-resposta" method="POST">
        <label for="campo-local">Vou ter contigo onde?</label>
        <textarea id="campo-local" name="Vou_ter_contigo_onde" rows="1" placeholder="Morada, zona ou ponto de encontro..."></textarea>
        <label for="campo-mensagem">Algo que queiras dizer e/ou comentar?</label>
        <textarea id="campo-mensagem" name="Mensagem" placeholder="ex: restaurante, sítios, horas..."></textarea>
        <input type="hidden" name="resposta" value="Sim">
        <input type="hidden" name="_subject" id="campo-subject" value="Ela disse sim!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" id="campo-next" value="">
        <button type="submit" id="btn-enviar">Confirmar</button>
      </form>
      <div id="estado-envio"></div>
    </div>

    <!-- ECRÃ 3: obrigado -->
    <div id="ecra-obrigado" class="oculto">
      <div class="emoji">🥂</div>
      <h1>Combinado!</h1>
      <p class="subtexto" id="texto-obrigado">Já recebi a tua resposta ehehehhe <3.</p>
    </div>

  </div>
</div>

<script>
  /* ============================================================
     PASSO OBRIGATÓRIO ANTES DE PUBLICARES:
     Substitui o texto abaixo pelo teu email. Não precisas de criar
     conta em lado nenhum — é o serviço gratuito FormSubmit.co.
     Atenção: à primeira vez que alguém enviar o formulário, o
     FormSubmit manda-te um email a pedir para CONFIRMARES o teu
     endereço (é só clicar num link). Só depois é que as respostas
     seguintes chegam automaticamente à tua caixa de correio.
     ============================================================ */
  const EMAIL_DESTINO = "miguel.ouro@outlook.com";
  const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/" + EMAIL_DESTINO;

  // Nome dela — muda aqui e atualiza-se em toda a página
  const NOME_DELA = "Daniela";

  document.getElementById('titulo-pergunta').textContent =
    NOME_DELA ? `${NOME_DELA}, aceitas sair comigo? 💛` : "Aceitas sair comigo? 💛";

  document.getElementById('titulo-resposta').textContent =
    NOME_DELA ? `Sabia que ias dizer que sim, ${NOME_DELA} 💫` : "Boa escolha 💫";

  document.getElementById('texto-obrigado').textContent = "Já recebi a tua resposta — até breve.";

  // --- estrelas ---
  const ceu = document.getElementById('ceu');
  const numEstrelas = window.innerWidth < 480 ? 40 : 70;
  for(let i=0;i<numEstrelas;i++){
    const e = document.createElement('div');
    e.className = 'estrela';
    e.style.left = Math.random()*100 + '%';
    e.style.top = Math.random()*70 + '%';
    e.style.animationDelay = (Math.random()*3.5) + 's';
    ceu.appendChild(e);
  }

  // --- botão "Não" foge ---
  const btnNao = document.getElementById('btn-nao');
  const btnSim = document.getElementById('btn-sim');
  const linha = document.getElementById('linha-botoes');
  const legenda = document.getElementById('legenda-fuga');

  const frases = [
    "Achas mesmo que ia deixar isso acontecer?",
    "Esse botão só é decoração 😅",
    "Tenta outra vez... ou não.",
    "Ele não quer ser clicado, desculpa.",
    "Continua a tentar, é engraçado de ver."
  ];

  let tentativas = 0;
  let simEscala = 1;

  function moverBotaoNao(){
    const limites = linha.getBoundingClientRect();
    const largura = btnNao.offsetWidth;
    const altura = btnNao.offsetHeight;
    const maxX = Math.max(limites.width - largura, 0);
    const maxY = Math.max(limites.height - altura, 0);

    btnNao.classList.add('fugir');
    btnNao.style.left = Math.random()*maxX + 'px';
    btnNao.style.top = Math.random()*maxY + 'px';

    tentativas++;
    legenda.textContent = frases[Math.min(tentativas-1, frases.length-1)];

    if(simEscala < 1.35){
      simEscala += 0.06;
      btnSim.style.transform = `scale(${simEscala})`;
    }
  }

  btnNao.addEventListener('mouseenter', moverBotaoNao);
  btnNao.addEventListener('click', (ev)=>{
    ev.preventDefault();
    moverBotaoNao();
  });
  // em ecrãs táteis, o "toque" também o faz fugir antes do clique
  btnNao.addEventListener('touchstart', (ev)=>{
    ev.preventDefault();
    moverBotaoNao();
  }, {passive:false});

  // --- fluxo dos ecrãs ---
  const ecraPergunta = document.getElementById('ecra-pergunta');
  const ecraResposta = document.getElementById('ecra-resposta');
  const ecraObrigado = document.getElementById('ecra-obrigado');
  const estadoEnvio = document.getElementById('estado-envio');
  const formulario = document.getElementById('formulario-resposta');

  // configura o formulário para enviar diretamente para o FormSubmit
  formulario.action = FORMSUBMIT_ENDPOINT;
  document.getElementById('campo-subject').value =
    NOME_DELA ? `${NOME_DELA} disse sim! 💫` : "Ela disse sim! 💫";
  // depois de enviar, o FormSubmit traz de volta a esta mesma página
  document.getElementById('campo-next').value =
    window.location.origin + window.location.pathname + "?obrigado=1";

  btnSim.addEventListener('click', ()=>{
    ecraPergunta.classList.add('oculto');
    ecraResposta.classList.remove('oculto');
  });

  formulario.addEventListener('submit', (ev)=>{
    if(EMAIL_DESTINO.includes('exemplo.com')){
      ev.preventDefault();
      estadoEnvio.textContent = "(Ainda não puseste o teu email — vê o comentário no início do código.)";
      return;
    }
    estadoEnvio.textContent = "A enviar...";
    document.getElementById('btn-enviar').disabled = true;
    // não faz preventDefault: deixa o browser enviar o formulário normalmente
  });

  // se voltamos aqui depois de um envio bem sucedido, mostra logo o ecrã final
  const parametros = new URLSearchParams(window.location.search);
  if(parametros.get('obrigado') === '1'){
    ecraPergunta.classList.add('oculto');
    ecraResposta.classList.add('oculto');
    ecraObrigado.classList.remove('oculto');
  }
</script>

</body>
</html>
